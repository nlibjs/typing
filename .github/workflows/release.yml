# npm Trusted Publisher: nlibjs / typing / release.yml; environment empty.
# Release and recovery: https://github.com/nlibjs/actions#release-procedure
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        type: choice
        options: [verify, stage]
        default: verify
        required: true
      tag:
        description: "Published Release tag for retry, e.g. v1.2.3"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  Verify:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    permissions:
      contents: read
    uses: nlibjs/actions/.github/workflows/npm-release.yml@53324e92eb61920ce5d274a42eb23f73dd98a383
    with:
      action: verify
  Stage:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || inputs.action == 'stage'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: nlibjs/actions/.github/workflows/npm-release.yml@53324e92eb61920ce5d274a42eb23f73dd98a383
    with:
      action: stage
      tag: ${{ github.event.release.tag_name || inputs.tag }}
  PublishJsr:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || inputs.action == 'stage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:prepare
      - run: npm run release:jsr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
